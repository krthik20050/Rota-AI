name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  # ── Windows Build ──────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set VERSION
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v',''
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV
          Write-Host "Building version: $VERSION"

      - name: Patch version.py
        shell: pwsh
        run: |
          $VERSION = $env:VERSION
          $path = "desktop/app/version.py"
          $content = Get-Content $path -Raw
          $content = $content -replace '__version__ = ".*?"', "__version__ = `"$VERSION`""
          Set-Content -Path $path -Value $content -NoNewline
          Get-Content $path

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install build dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
          python -m pip check
          python -c "from PySide6 import QtCore, QtGui, QtWidgets, QtMultimedia"

      - name: Build RotaAI.exe
        shell: pwsh
        run: |
          $specPath = Join-Path $env:GITHUB_WORKSPACE "rota-ai.spec"
          Write-Host "Spec path: $specPath"
          Write-Host "Exists: $(Test-Path $specPath)"
          Get-ChildItem $env:GITHUB_WORKSPACE -Filter "*.spec"
          python -m PyInstaller $specPath --clean --noconfirm

      - name: Smoke test packaged app
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist/RotaAI/RotaAI.exe" -ArgumentList "--smoke-test" -PassThru -WindowStyle Hidden
          if (-not $app.WaitForExit(60000)) {
            Stop-Process -Id $app.Id -Force
            throw "Packaged app did not finish its startup smoke test"
          }
          if ($app.ExitCode -ne 0) { throw "Packaged app failed startup: exit $($app.ExitCode)" }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          winget install JRSoftware.InnoSetup --silent --accept-package-agreements --accept-source-agreements
          $deadline = (Get-Date).AddSeconds(120)
          $candidates = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          while ((Get-Date) -lt $deadline) {
            foreach ($path in $candidates) {
              if (Test-Path $path) { Write-Host "Inno Setup ready at $path"; exit 0 }
            }
            Start-Sleep -Seconds 5
          }
          Write-Error "Inno Setup not found after 120s"
          exit 1

      - name: Build RotaAI-Setup.exe
        shell: pwsh
        run: |
          $iscc = "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe" }
          Write-Host "Using ISCC at: $iscc"
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup not found"; exit 1 }
          $issPath = "installer.iss"
          $iss = Get-Content $issPath -Raw
          $iss = $iss -replace '#define AppVersion ".*?"', "#define AppVersion `"$env:VERSION`""
          Set-Content -Path $issPath -Value $iss -NoNewline
          New-Item -ItemType Directory -Force -Path installer-output | Out-Null
          & $iscc $issPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = "installer-output\RotaAI-Setup.exe"
          if (-not (Test-Path $exe)) { Write-Error "Installer not found"; exit 1 }
          $size = (Get-Item $exe).Length
          Write-Host "Installer size: $size bytes"

      - name: Smoke test installed app
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "RotaAI-install-test"
          $installer = Start-Process -FilePath "installer-output/RotaAI-Setup.exe" -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=$installDir") -PassThru -WindowStyle Hidden
          if (-not $installer.WaitForExit(120000)) {
            Stop-Process -Id $installer.Id -Force
            throw "Installer timed out"
          }
          if ($installer.ExitCode -ne 0) { throw "Installation failed: exit $($installer.ExitCode)" }
          $app = Start-Process -FilePath (Join-Path $installDir "RotaAI.exe") -ArgumentList "--smoke-test" -PassThru -WindowStyle Hidden
          if (-not $app.WaitForExit(60000)) {
            Stop-Process -Id $app.Id -Force
            throw "Installed app did not finish its startup smoke test"
          }
          if ($app.ExitCode -ne 0) { throw "Installed app failed startup: exit $($app.ExitCode)" }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer-output/RotaAI-Setup.exe
          retention-days: 30

  # ── Linux Build (AppImage) ────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set VERSION
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version: $VERSION"

      - name: Patch version.py
        shell: bash
        run: |
          sed -i "s/__version__ = \".*\"/__version__ = \"$VERSION\"/" desktop/app/version.py
          grep __version__ desktop/app/version.py

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libportaudio2 portaudio19-dev \
            libdbus-glib-1-dev libdbus-1-dev \
            at-spi2-core libatk-bridge2.0-0 \
            libsecret-1-dev \
            xvfb xdotool wl-clipboard \
            python3-pyatspi \
            fuse libfuse2 \
            appstream \
            git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r linux/requirements-linux.txt
          pip install pyinstaller

      - name: Build AppImage
        run: |
          chmod +x linux/build-linux.sh
          ./linux/build-linux.sh

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/RotaAI.AppImage
          retention-days: 30

  # ── macOS Build (.app zip) ────────────────────────────────────────────────
  build-macos:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set VERSION
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version: $VERSION"

      - name: Patch version.py
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("desktop/app/version.py")
          version = os.environ["VERSION"]
          path.write_text(f'__version__ = "{version}"\n', encoding="utf-8")
          print(path.read_text(encoding="utf-8"))
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          brew install portaudio
          python -m pip install --upgrade pip setuptools wheel
          pip install -r macos/requirements-macos.txt
          pip install pyinstaller

      - name: Build macOS app zip
        env:
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          chmod +x macos/build-macos.sh
          ./macos/build-macos.sh

      - name: Verify macOS artifact
        run: |
          test -d dist/RotaAI.app
          test -f dist/RotaAI-macOS.zip
          codesign --verify --deep --strict dist/RotaAI.app
          spctl --assess --type execute --verbose=4 dist/RotaAI.app || true

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/RotaAI-macOS.zip
          retention-days: 30

  # ── Create Release ────────────────────────────────────────────────────────
  # Windows is the primary deliverable: publish as soon as the Windows build
  # succeeds. Linux/macOS assets are attached only when those builds succeed,
  # so a failed secondary build can no longer block the installer release
  # (this is what silently dropped the v1.0.x/v1.1.0 installers).
  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer

      # Optional platform artifacts: if those builds failed, release anyway
      # with whatever exists (Windows installer minimum).
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-appimage
        continue-on-error: true

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-app
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Rota AI ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            RotaAI-Setup.exe
            RotaAI.AppImage
            RotaAI-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
