name: Website CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'website/**'
      - '.github/workflows/website-ci.yml'
  pull_request:
    branches: [main]
    # No paths filter here: the "Protect main" ruleset requires the
    # website-ci check on every PR, so a path-filtered workflow would skip
    # desktop-only PRs and block them forever (a skipped required check
    # never reports SUCCESS). The job is ~35s, so always-run is cheap.
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website-ci:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js site
        run: npm run build

      - name: Lint check
        run: npm run lint
